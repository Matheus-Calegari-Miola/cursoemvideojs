<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo</title>
</head>
<body>
    <script>

           confirm("Você gosta de ler livros?")
             let book = prompt("Qual livro você está lendo no momento ?")
             let book2 = prompt("Mencione outro livro: ")
             let book3 = prompt("Mencione mais um livro")
             alert(`Os livros que você gosta de ler são: ${book}, ${book2} e ${book3}`)
             let nameOfBook = prompt("Qual o nome do seu livro favorito:")
             document.write(`Seu livro favorito ${nameOfBook} tem ${nameOfBook.length} letras. <br/>`)
             document.write(`O nome do seu livro favorito em maiúsculo fica ${nameOfBook.toUpperCase()} <br/>`)
             document.write(`O nome do seu livro favorito em minúsculo fica ${nameOfBook.toLowerCase()}<br/>`)

    </script>
    
</body>
</html>
