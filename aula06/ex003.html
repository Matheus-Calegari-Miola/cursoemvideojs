<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color:rgb(255, 255, 255); /* Comentário em CSS */
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1> <!-- Isso é comentário -->
    <p>Já me livrei da maldição</p>
    <script>
      let n1 = Number(prompt("Digite um número: ")) //String
      let n2 = Number(prompt("Digite outro número: ")) // String
      let s = n1 + n2

      alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) // Concatenação
      // number + number para adição
      // string + string para concatenação
    </script>
</body>
</html>
